<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gogetti Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header met Navigatiebalk -->
    <header class="site-header">
        <button class="menu-toggle" id="menuOpenBtn" aria-label="Open menu">☰</button>
        <div class="logo">Gogetti</div>
        <div class="header-icons">
            <span class="icon-search">🔍</span>
            <span class="icon-cart">🛒 <small>(0)</small></span>
        </div>
    </header>

    <!-- Het Volledige Mobiele Menu Overlap -->
    <div class="mobile-menu-overlay" id="mobileMenu">
        <div class="menu-header">
            <button class="menu-close" id="menuCloseBtn">&times;</button>
            <div class="logo">Gogetti</div>
            <div class="header-icons">
                <span>🔍</span>
                <span>🛒 (0)</span>
            </div>
        </div>

        <div class="menu-content">
            <!-- Hoofdmenu Items -->
            <ul class="menu-list" id="mainMenuList">
                <li><a href="#new-arrivals" class="menu-link">New Arrivals</a></li>
                <li><button class="menu-link has-arrow" data-target="submenu-menswear">Menswear</button></li>
                <li><button class="menu-link has-arrow" data-target="submenu-footwear">Footwear</button></li>
                <li><button class="menu-link has-arrow" data-target="submenu-accessories">Accessories</button></li>
                <li><button class="menu-link has-arrow" data-target="submenu-about">About</button></li>
            </ul>

            <!-- Submenu: Menswear (Zomer Filter) -->
            <div class="submenu-panel" id="submenu-menswear">
                <button class="back-btn">&larr; Menswear</button>
                <ul class="submenu-list">
                    <li><a href="#linen">linen</a></li>
                    <li><a href="#t-shirts-polos">T-Shirts & Polos</a></li>
                    <li><a href="#trousers">Trousers</a></li>
                    <li><a href="#swimwear">Swimwear</a></li>
                    <li><a href="#lounge-collection">Lounge Collection</a></li>
                </ul>
            </div>

            <!-- Submenu: Footwear -->
            <div class="submenu-panel" id="submenu-footwear">
                <button class="back-btn">&larr; Footwear</button>
                <ul class="submenu-list">
                    <li><a href="#soft-tide-loaders">Soft tide loafers</a></li>
                    <li><a href="#velour-slip-on">Velour Slip-on</a></li>
                </ul>
            </div>

            <!-- Submenu: Accessories -->
            <div class="submenu-panel" id="submenu-accessories">
                <button class="back-btn">&larr; Accessories</button>
                <ul class="submenu-list">
                    <li><a href="#headwear">Headwear</a></li>
                    <li><a href="#leather-accessories">Leather Accessories</a></li>
                </ul>
            </div>

            <!-- Submenu: About -->
            <div class="submenu-panel" id="submenu-about">
                <button class="back-btn">&larr; About</button>
                <ul class="submenu-list">
                    <li><a href="#world-of-gogetti">The World of Gogetti</a></li>
                    <li><a href="#flagship-store">Flagship Store</a></li>
                    <li><a href="#artists">Artists</a></li>
                </ul>
            </div>
        </div>

        <!-- Kleine 10% kortingsbalk onderaan het menu -->
        <div class="menu-promo-badge" id="promoBadge">
            <span>First time? Here's 10% off</span>
            <button id="closePromoBtn">&times;</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
